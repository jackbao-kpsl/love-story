<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦒💜🦥</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" as="audio" href="music/Carpe%20sakuracloud%20-%20silly%20cat.m4a" type="audio/mp4">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-bg"></div>

    <div class="container">
        <h1>Will you keep being my cục mochi biết thở for many more anniversaries? 💜💕</h1>
        <h3 class="warning-line">Don't you dare say no! 😠</h3>

        <div class="gif-container">
            <img id="cat-gif" src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="cute character">
        </div>

        <div class="buttons">
            <button id="yes-btn" onclick="handleYesClick()">Yes</button>
            <button id="no-btn" onclick="handleNoClick()">No</button>
        </div>
        <div id="tease-toast"></div>
    </div>

    <audio id="bg-music" loop autoplay muted preload="auto" playsinline>
        <source src="music/Carpe%20sakuracloud%20-%20silly%20cat.m4a" type="audio/mp4">
    </audio>

    <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>

    <script src="script.js"></script>
</body>
</html>
